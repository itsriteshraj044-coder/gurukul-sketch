# On every push to main:
#  1. builds the site
#  2. uploads dist/ (including .htaccess) to Hostinger with lftp, if the FTP secrets are set
#  3. also publishes dist/ to the `hostinger` branch (for hPanel's Git deployment, if you prefer that)
#
# FTP secrets (Settings > Secrets and variables > Actions > Secrets):
#   FTP_SERVER      e.g. ftp.yourdomain.com or the IP shown in hPanel > Files > FTP Accounts
#   FTP_USERNAME    e.g. u123456789 or u123456789.yourdomain.com
#   FTP_PASSWORD    the FTP account password
#   FTP_SERVER_DIR  optional, folder to upload into, ending with "/" (default: public_html/)
name: Build & deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional: set these under Settings > Secrets and variables > Actions > Variables
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_ENQUIRY_ENDPOINT: ${{ vars.VITE_ENQUIRY_ENDPOINT }}

      - name: Upload to Hostinger (FTP)
        if: env.HAS_FTP == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          DIR="${FTP_DIR%/}"
          upload() {
            # $1 = "true" to try FTPS (encrypted), "false" for plain FTP
            lftp <<LFTP
          set ftp:ssl-allow $1
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:timeout 30
          set net:max-retries 4
          set net:reconnect-interval-base 5
          open --env-password -u "$FTP_USERNAME" "$FTP_SERVER"
          mirror --reverse --only-newer --parallel=2 --verbose --exclude-glob .git* --exclude ^assets/ dist/ "$DIR/" && mirror --reverse --delete --parallel=2 --verbose dist/assets/ "$DIR/assets/"
          LFTP
          }
          # Uploads every file (including .htaccess); stale hashed files are removed only inside assets/.
          upload true || { echo "::warning::FTPS upload failed, retrying over plain FTP"; upload false; }

      - name: FTP not configured
        if: env.HAS_FTP != 'true'
        run: echo "::notice::FTP secrets not set yet, so the upload was skipped. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD under Settings > Secrets and variables > Actions."

      - name: Publish dist/ to the hostinger branch
        run: |
          cd dist
          git init -q -b hostinger
          git config user.name "itsriteshrajcoder-044"
          git config user.email "itsriteshraj044@gmail.com"
          git add -A
          git commit -q -m "Deploy build of ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger
